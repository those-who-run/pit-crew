name: Image

# The two container images on every PR: image.yml in those-who-run/.github builds
# each from its Dockerfile, smoke-tests it and pushes nothing. The jobs are
# required by name on `main` as `image / build` (the small image, Dockerfile) and
# `runner / build` (the agent step's image, Dockerfile.runner); renaming either
# leaves `main` waiting for a check that never reports.
#
# It runs in the merge queue too (merge_group), as ci.yml does, and still pushes
# nothing there: this job may only read, and publishing is release.yml's.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; the job asks for what it uses.
permissions: {}

# As in ci.yml: only a superseded PR run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The small image: it must build, report its version and run as the non-root
  # user. It serves nothing, so there is no endpoint to call.
  image:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@43bd417e15003de63a0c92122fa93da301cf586e # v0.2.18
    with:
      smoke: |
        docker run --rm "$IMAGE" -version
        docker run --rm --entrypoint /twr-claude "$IMAGE" -version
        user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
        if [ "$user" != 65532:65532 ]; then
          echo "the image runs as '$user', not the nonroot user" >&2
          exit 1
        fi
        docker run --rm --entrypoint git "$IMAGE" --version
  # The runner image: the wrapper and every tool the agent step needs must be
  # there, as the non-root user. The check is `runner / build`.
  runner:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@43bd417e15003de63a0c92122fa93da301cf586e # v0.2.18
    with:
      image: twr-pit-crew-runner
      dockerfile: Dockerfile.runner
      smoke: |
        docker run --rm "$IMAGE" -version
        user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
        if [ "$user" != 65532:65532 ]; then
          echo "the image runs as '$user', not the agent user" >&2
          exit 1
        fi
        for tool in "claude --version" "git --version" "go version" "python3 --version" "uv --version" "node --version" "buf --version" "kustomize version" "kubeconform -v" "pre-commit --version"; do
          # shellcheck disable=SC2086
          docker run --rm --entrypoint sh "$IMAGE" -c "$tool" || { echo "$tool failed" >&2; exit 1; }
        done
        if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v docker || command -v podman'; then
          echo "the runner image carries a container runtime" >&2
          exit 1
        fi

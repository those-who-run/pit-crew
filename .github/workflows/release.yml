name: Release

# Publishes a release's two images: release-pr.yml dispatches this on the new
# `vX.Y.Z` tag once release-please has tagged. image.yml in those-who-run/.github
# builds and smoke-tests each image from the tag; image-publish.yml then pushes
# that exact build as ghcr.io/those-who-run/twr-pit-crew:X.Y.Z and
# ghcr.io/those-who-run/twr-pit-crew-runner:X.Y.Z and attests it. image-publish.yml
# fails on any ref but a release tag and runs in this repository's `release`
# environment (v* tags only, the maintainer as required reviewer), so a dispatch by
# hand on a branch publishes nothing. Only the publish job can write packages.
on:
  workflow_dispatch:

# Nothing by default; each job asks for what it uses.
permissions: {}

jobs:
  image:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      smoke: docker run --rm "$IMAGE" -version
  publish:
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: those-who-run/.github/.github/workflows/image-publish.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      digest: ${{ needs.image.outputs.digest }}
      artifact: ${{ needs.image.outputs.artifact }}
  # The runner image, published beside the small one as twr-pit-crew-runner.
  runner:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      image: twr-pit-crew-runner
      dockerfile: Dockerfile.runner
      smoke: docker run --rm "$IMAGE" -version
  publish-runner:
    needs: runner
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: those-who-run/.github/.github/workflows/image-publish.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      image: twr-pit-crew-runner
      digest: ${{ needs.runner.outputs.digest }}
      artifact: ${{ needs.runner.outputs.artifact }}
